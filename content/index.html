<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="color-scheme" content="light dark" />
  <title>Nexus</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="memory.css" />
  <link rel="stylesheet" href="jarvis.css" />
  <link rel="stylesheet" href="leaflet.css" />
  <link rel="stylesheet" href="display.css" />
</head>
<body>
  <!-- Full-bleed game canvas behind everything -->
  <canvas id="stage"></canvas>

  <!-- Draggable top bar -->
  <header id="topbar">
    <div class="brand" aria-label="Nexus">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Nexus</span>
      <span id="verTag" class="ver">v0.0.0</span>
    </div>
    <div class="topbar-actions">
      <button id="jarvisBtn" class="ghost-btn" type="button" title="Hands-free — say &quot;Sea, …&quot;" aria-label="Hands-free">🎧</button>
      <button id="visionBtn" class="ghost-btn" type="button" title="Let Sea see your screen" aria-label="Vision">👁️</button>
      <button id="memoryBtn" class="ghost-btn" type="button" title="Memory" aria-label="Memory">🧠</button>
      <button id="updateBtn" class="ghost-btn" type="button" title="Check for updates" aria-label="Check for updates">⟳</button>
      <button id="settingsBtn" class="ghost-btn" type="button" title="Settings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <!-- Director's answer card -->
  <section id="answerCard" aria-live="polite">
    <span class="nova-dot" aria-hidden="true"></span>
    <div id="answerText"></div>
  </section>

  <!-- Transcript subtitle -->
  <div id="subtitle" aria-live="polite"></div>

  <!-- Floating glass command bar -->
  <div id="commandBar" role="group" aria-label="Ask the Director">
    <input id="command" type="text" autocomplete="off" spellcheck="false"
           placeholder="Ask Agent Sea anything…" aria-label="Command input" />
    <button id="mic" class="round-btn" type="button" title="Voice" aria-label="Record voice">🎙️</button>
    <button id="send" class="round-btn send" type="button" title="Send" aria-label="Send">➤</button>
  </div>

  <!-- Setup overlay -->
  <div id="setup" aria-hidden="true">
    <div class="setup-card" role="dialog" aria-modal="true" aria-labelledby="setupHeading">
      <div class="setup-mark" aria-hidden="true">✦</div>
      <h1 id="setupHeading">Welcome to Nexus</h1>
      <p class="setup-sub">Add your API key to bring Agent Sea online.</p>
      <input id="keyInput" type="password" autocomplete="off" spellcheck="false"
             placeholder="Paste your API key" aria-label="API key" />
      <div id="keyError" role="alert"></div>
      <button id="keySave" type="button">Save &amp; continue</button>
    </div>
  </div>

  <!-- Transient toast -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Memory panel -->
  <div id="memBackdrop"></div>
  <aside id="memoryPanel" aria-hidden="true" aria-label="Memory">
    <header class="mem-head">
      <span class="mem-title">🧠 Memory</span>
      <button id="memClose" type="button" title="Close">✕</button>
    </header>
    <div class="mem-tabs">
      <button class="mem-tab active" type="button" data-tab="notes">Knowledge</button>
      <button class="mem-tab" type="button" data-tab="secrets">Keys &amp; secrets</button>
    </div>
    <section class="mem-body" data-panel="notes">
      <form id="noteForm" class="mem-form" autocomplete="off">
        <input id="noteInput" type="text" placeholder="Remember… e.g. My company is Acme; deploy = npm run ship" />
        <button type="submit">Add</button>
      </form>
      <ul id="noteList" class="mem-list"></ul>
    </section>
    <section class="mem-body hidden" data-panel="secrets">
      <p class="mem-note" id="secNote">Stored encrypted on this Mac (Keychain). Values are never shown or sent to the AI.</p>
      <form id="secForm" class="mem-form mem-form-col" autocomplete="off">
        <input id="secName" type="text" placeholder="Name — e.g. stripe" />
        <input id="secValue" type="password" placeholder="Secret value — e.g. sk_live_…" autocomplete="off" />
        <input id="secDesc" type="text" placeholder="What it's for (optional)" />
        <button type="submit">Store securely</button>
      </form>
      <ul id="secList" class="mem-list"></ul>
    </section>
  </aside>

  <script type="module" src="voice.js"></script>
  <script src="leaflet.js"></script>
  <script src="game.js"></script>
  <script src="display.js"></script>
  <script src="renderer.js"></script>
  <script src="memory.js"></script>
  <script src="jarvis.js"></script>
</body>
</html>
